# ÿ���������Զ��������� | Auto-Update Data on Every Trading Day
#
# ��ʱ������ʱ����һ������ 17:00��UTC 9:00����A �����̺�
# Schedule: Mon-Fri at 17:00 Beijing time (UTC 9:00), after A-share market close
#
# �ڼ��յķǽ����գ��ܵ������������ݣ�parquet �ޱ仯 �� �Զ������ύ
# On non-trading holidays: no new data �� parquet unchanged �� commit step auto-skips

name: Update Market Data

on:
  schedule:
    - cron: "0 9 * * 1-5"
  workflow_dispatch:

concurrency:
  group: market-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run regression tests
        run: python -m pytest -q

      - name: Run data pipeline
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: |
          # Refresh through the latest available date, even when local research pins a snapshot.
          python - <<'PY'
          from pathlib import Path
          import yaml

          path = Path("config.yaml")
          config = yaml.safe_load(path.read_text(encoding="utf-8"))
          config["data"]["end_date"] = None
          path.write_text(yaml.safe_dump(config, sort_keys=False), encoding="utf-8")
          PY
          python run_pipeline.py --config config.yaml

      - name: Update README with latest metrics
        run: python scripts/update_readme.py

      - name: Commit and verify published data
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: python scripts/publish_market_data.py --branch "$TARGET_BRANCH"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: market-data-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            outputs/reports/pipeline.log
            outputs/reports/data_failures.csv
            outputs/reports/publication.json
            outputs/reports/publication.patch
            data/processed/panel_daily.parquet
            outputs/figures/*.png
            outputs/tables/*.csv
            outputs/reports/backtest_report.md
            README.md
          retention-days: 14
          if-no-files-found: ignore
