# 每个交易日自动更新数据 | Auto-Update Data on Every Trading Day
#
# 定时：北京时间周一至周五 17:00（UTC 9:00），A 股收盘后
# Schedule: Mon-Fri at 17:00 Beijing time (UTC 9:00), after A-share market close
#
# 节假日的非交易日：管道拉不到新数据，parquet 无变化 → 自动跳过提交
# On non-trading holidays: no new data → parquet unchanged → commit step auto-skips

name: Update Market Data

on:
  schedule:
    - cron: "0 9 * * 1-5"
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run data pipeline
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: |
          # Refresh through the latest available date, even when local research pins a snapshot.
          python - <<'PY'
          from pathlib import Path
          import yaml

          path = Path("config.yaml")
          config = yaml.safe_load(path.read_text(encoding="utf-8"))
          config["data"]["end_date"] = None
          path.write_text(yaml.safe_dump(config, sort_keys=False), encoding="utf-8")
          PY
          python run_pipeline.py --config config.yaml

      - name: Update README with latest metrics
        run: python scripts/update_readme.py

      - name: Commit updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update market data to latest"
          commit_options: "--no-verify"
          file_pattern: "data/processed/panel_daily.parquet outputs/figures/*.png outputs/tables/*.csv outputs/reports/backtest_report.md README.md"
          skip_dirty_check: false
          skip_fetch: true
          disable_globbing: false
